name: Backend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source branch
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^users/[a-z0-9._-]+/(feature|bugfix|hotfix|chore|docs|refactor|test)/[a-z0-9._-]+$ ]]; then
            echo "Invalid branch name: $BRANCH"
            echo "Expected: users/<name>/<type>/<description>"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
